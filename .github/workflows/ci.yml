name: CI Pipeline

on:
  push:
    branches: ["main", "dev", "tests"]
  pull_request:
    branches: ["main", "dev", "tests"]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://admin:admin123@localhost:5432/test_db
      NODE_ENV: test
      JWT_SECRET: 1e0e789d1f02b40fa729dceb36832a574217fb9fd0714957c39be2c2595b3474
      JWT_EXPIRES_IN: 7d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Create test database
        run: PGPASSWORD=admin123 psql -h localhost -U admin -d postgres -c "CREATE DATABASE test_db;" || true

      - name: Remove root .env
        run: rm -f ../.env

      - name: Run tests
        run: npm run test:ci

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --if-present