name: DAST - ZAP API Scan
# Alert Codes - https://www.zaproxy.org/docs/alerts/
on:
    push:
        branches: ["main", "dev"]
    pull_request:
        branches: ["main", "dev"]
    schedule:
        - cron: "0 17 * * 5"
    workflow_dispatch: # run manually in github actions

# workflow
permissions:
    contents: read
    issues: write

jobs:
    zap_api:
        name: ZAP API Scan
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: server

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: admin
                    POSTGRES_PASSWORD: admin123
                    POSTGRES_DB: test_db
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U admin -d test_db"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            DATABASE_URL: postgresql://admin:admin123@localhost:5432/test_db
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN: 7d
            RATE_LIMIT_MAX: "10000"
            NODE_ENV: test
            IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
            IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
            EMAIL: ${{ secrets.EMAIL }}
            EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
            CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

        steps:
            - uses: actions/checkout@v5 # clone repo

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: server/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Remove local .env
              run: rm -f ../.env

            - name: Generate Prisma client and run migrations
              run: npm run prisma:ci

            - name: Start backend
              run: npm run dev &

            - name: Wait for API spec
              run: npx wait-on http://127.0.0.1:3000/api/docs.json --timeout 30000

            - name: ZAP API Scan
              uses: zaproxy/action-api-scan@v0.9.0
              with:
                  format: openapi
                  target: http://127.0.0.1:3000/api/docs.json
                  fail_action: true # fail workflow
                  artifact_name: zap-api-report
                  rules_file_name: .github/zap/rules.tsv
