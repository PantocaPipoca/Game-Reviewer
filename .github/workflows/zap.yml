name: DAST - ZAP API Scan

on:
  push:
    branches: ["main", "dev", "tests"]
  workflow_dispatch: # run manually in github actions

# workflow
permissions:
  contents: read
  issues: write

jobs:
  zap_api:
    name: ZAP API Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://admin:admin123@localhost:5432/test_db
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4 # download repo

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Remove local .env
        run: rm -f ../.env

      - name: Generate Prisma client and run migrations
        run: npm run prisma:ci

      - name: Start backend
        run: npm run dev &

      - name: Wait for API spec
        run: npx wait-on http://127.0.0.1:3000/api/docs.json --timeout 30000

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          format: openapi
          target: http://127.0.0.1:3000/api/docs.json
          fail_action: true # fail workflow
          artifact_name: zap-api-report