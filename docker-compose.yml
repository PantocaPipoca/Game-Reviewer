services:

  postgres:
    image: postgres:16-alpine
    container_name: gr_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: gr_server
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}

  client:
    build: ./client
    container_name: gr_clients
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
