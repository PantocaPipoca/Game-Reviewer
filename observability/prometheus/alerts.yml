groups:
  - name: game-reviewer
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate above 10%"
          description: "{{ $value | humanizePercentage }} of requests are returning 5xx errors"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by(le)(rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 2s"
          description: "p95 response time is {{ $value | humanizeDuration }}"

      - alert: ServerDown
        expr: up{job="game-reviewer-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Server is not responding"
          description: "Game Reviewer API is down for more than 1 minute"

      - alert: HighMemoryUsage
        expr: nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node.js heap above 90%"
          description: "Heap is at {{ $value | humanizePercentage }} — possible memory leak"